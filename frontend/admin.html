<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Admin Dashboard | Holkar Stadium</title>
    <style>
        @layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;min-height:100vh;background-attachment:fixed;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{"colors":{"secondary":"#b9c7e4","on-surface":"#d9e2ff","surface":"#08132a","on-primary-fixed-variant":"#005142","background":"#08132a","on-primary":"#00382d","on-secondary-container":"#abb9d6","on-tertiary-fixed-variant":"#5e4200","on-primary-container":"#00725e","tertiary-fixed":"#ffdea8","surface-container":"#151f37","on-tertiary":"#412d00","surface-variant":"#2a344d","inverse-on-surface":"#263049","on-tertiary-container":"#845d00","error-container":"#93000a","on-tertiary-fixed":"#271900","on-background":"#d9e2ff","inverse-surface":"#d9e2ff","surface-tint":"#38debb","tertiary-fixed-dim":"#ffba20","surface-container-lowest":"#030d25","surface-dim":"#08132a","on-secondary-fixed-variant":"#39475f","primary-container":"#5ffbd6","secondary-fixed":"#d6e3ff","outline":"#85948e","surface-container-highest":"#2a344d","error":"#ffb4ab","on-error-container":"#ffdad6","inverse-primary":"#006b58","primary-fixed-dim":"#38debb","tertiary-container":"#ffdea8","on-error":"#690005","on-surface-variant":"#bacac3","tertiary":"#ffffff","secondary-fixed-dim":"#b9c7e4","surface-container-low":"#101b33","on-secondary-fixed":"#0d1c32","surface-container-high":"#1f2942","on-primary-fixed":"#002019","on-secondary":"#233148","primary":"#ffffff","outline-variant":"#3c4a45","secondary-container":"#3c4962","surface-bright":"#2f3952","primary-fixed":"#5ffbd6"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"gutter":"24px","container-max":"1280px","unit":"8px","margin-desktop":"48px","margin-mobile":"16px"},"fontFamily":{"body-lg":["Inter"],"display-lg-mobile":["Montserrat"],"body-md":["Inter"],"headline-md":["Montserrat"],"display-lg":["Montserrat"],"label-sm":["Inter"]},"fontSize":{"body-lg":["18px",{"lineHeight":"1.6","fontWeight":"400"}],"display-lg-mobile":["32px",{"lineHeight":"1.2","fontWeight":"800"}],"body-md":["16px",{"lineHeight":"1.5","fontWeight":"400"}],"headline-md":["24px",{"lineHeight":"1.3","fontWeight":"700"}],"display-lg":["48px",{"lineHeight":"1.1","letterSpacing":"-0.02em","fontWeight":"800"}],"label-sm":["12px",{"lineHeight":"1","letterSpacing":"0.05em","fontWeight":"600"}]}}}}</script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
</head>
<body class="bg-background font-body-md text-on-background min-h-screen flex flex-col bg-gradient-to-br from-[#08132a] via-[#0d1c32] to-[#151f37] selection:bg-primary-container selection:text-on-primary-container">
    <header class="fixed top-0 w-full z-50 bg-white/5 backdrop-blur-md border-b border-white/10">
        <div class="h-20 w-full px-margin-desktop flex items-center justify-between">
            <div class="flex items-center gap-4">
                <span class="material-symbols-outlined text-primary-fixed text-[32px]">stadium</span>
                <span class="font-headline-md text-headline-md text-on-surface tracking-tight">Holkar Stadium Box Office</span>
            </div>
            <nav class="hidden md:flex items-center gap-gutter">
                <a href="index.html" class="text-body-md font-body-md text-on-surface-variant hover:text-on-surface transition-all">Match Box Office</a>
                <a href="admin.html" class="transition-all text-primary-fixed font-bold border-b-2 border-primary-fixed pb-1">Admin Dashboard</a>
            </nav>
            <div class="flex items-center gap-gutter">
                <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center">
                    <span class="material-symbols-outlined text-on-primary text-[18px]">person</span>
                </div>
            </div>
        </div>
    </header>

    <main class="w-full pt-20 flex-1 relative z-10">
        <div class="w-full px-margin-mobile md:px-margin-desktop py-margin-desktop relative z-10 max-w-container-max mx-auto">
            <div class="mb-gutter flex flex-col md:flex-row justify-between items-start md:items-end gap-unit">
                <div class="flex flex-col gap-2">
                    <span class="font-label-sm text-label-sm text-primary-fixed uppercase tracking-[0.2em] font-bold">Control Center</span>
                    <h1 class="font-display-lg text-display-lg text-on-background">Match Operations</h1>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-gutter items-start">
                <!-- Add Match Form -->
                <div class="lg:col-span-5 flex flex-col gap-unit">
                    <div class="bg-surface-container/70 backdrop-blur-xl rounded-xl p-6 shadow-2xl border border-white/10">
                        <h2 class="font-headline-md text-headline-md text-on-surface mb-6 flex items-center gap-3">
                            <span class="material-symbols-outlined">add_circle</span> Schedule New Fixture
                        </h2>
                        <form class="flex flex-col gap-6" id="createMatchForm">
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div class="flex flex-col gap-2">
                                    <label class="text-xs text-on-surface-variant uppercase">Home Team</label>
                                    <input id="teamA" name="teamA" placeholder="e.g. India" required class="w-full bg-surface-container-low/50 border-b-2 border-white/10 rounded-t-lg px-4 py-3 focus:outline-none focus:border-primary-fixed"/>
                                </div>
                                <div class="flex flex-col gap-2">
                                    <label class="text-xs text-on-surface-variant uppercase">Away Team</label>
                                    <input id="teamB" name="teamB" placeholder="e.g. Australia" required class="w-full bg-surface-container-low/50 border-b-2 border-white/10 rounded-t-lg px-4 py-3 focus:outline-none focus:border-primary-fixed"/>
                                </div>
                            </div>
                            <div class="flex flex-col gap-2">
                                <label class="text-xs text-on-surface-variant uppercase">Date & Time</label>
                                <input type="datetime-local" id="matchDate" name="matchDate" required class="w-full bg-surface-container-low/50 border-b-2 border-white/10 rounded-t-lg px-4 py-3 focus:outline-none focus:border-primary-fixed text-black"/>
                            </div>
                            <div class="flex flex-col gap-2">
                                <label class="text-xs text-on-surface-variant uppercase">Total Capacity</label>
                                <input type="number" id="totalTickets" name="totalTickets" required class="w-full bg-surface-container-low/50 border-b-2 border-white/10 rounded-t-lg px-4 py-3 focus:outline-none focus:border-primary-fixed"/>
                            </div>
                            <button type="submit" class="w-full mt-2 bg-primary-fixed text-on-primary-fixed font-bold py-4 rounded-lg hover:bg-primary-fixed-dim transition-all">
                                Deploy Match
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Active Matches List with Search Bar -->
                <div class="lg:col-span-7 flex flex-col gap-unit h-[800px]">
                    <div class="bg-surface-container-lowest/80 backdrop-blur-xl rounded-xl p-6 shadow-2xl border border-white/5 h-full flex flex-col relative">
                        
                        <!-- Header with Search Bar -->
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-6 flex-shrink-0 gap-4">
                            <h2 class="font-headline-md text-headline-md text-on-surface flex items-center gap-3 whitespace-nowrap">
                                <span class="material-symbols-outlined">event_note</span> Active Roster
                            </h2>
                            <div class="flex items-center gap-3 w-full sm:w-auto">
                                <div class="relative w-full sm:w-64">
                                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant opacity-70 text-lg">search</span>
                                    <input type="text" id="searchInput" placeholder="Search teams..." class="w-full bg-surface-container-low/50 border-b-2 border-white/10 rounded-lg pl-10 pr-4 py-2 focus:outline-none focus:border-primary-fixed text-sm">
                                </div>
                                <span class="text-sm bg-surface-container-high px-3 py-2 rounded-full whitespace-nowrap"><span id="matchCount">0</span> Matches</span>
                            </div>
                        </div>

                        <div class="flex-1 overflow-y-auto pr-2 flex flex-col gap-4" id="matchesList">
                            <!-- Matches injected here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Edit Match Modal (Hidden by default) -->
    <div id="editModal" class="fixed inset-0 bg-background/80 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-surface-container rounded-xl p-6 shadow-2xl border border-white/10 w-full max-w-lg relative">
            <button onclick="closeEditModal()" class="absolute top-4 right-4 text-on-surface-variant hover:text-error transition-colors">
                <span class="material-symbols-outlined">close</span>
            </button>
            <h2 class="font-headline-md text-headline-md text-on-surface mb-6 flex items-center gap-3">
                <span class="material-symbols-outlined">edit</span> Edit Fixture
            </h2>
            <form class="flex flex-col gap-6" id="editMatchForm">
                <input type="hidden" id="editMatchId">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="flex flex-col gap-2">
                        <label class="text-xs text-on-surface-variant uppercase">Home Team</label>
                        <input id="editTeamA" required class="w-full bg-surface-container-low/50 border-b-2 border-white/10 rounded-t-lg px-4 py-3 focus:outline-none focus:border-primary-fixed"/>
                    </div>
                    <div class="flex flex-col gap-2">
                        <label class="text-xs text-on-surface-variant uppercase">Away Team</label>
                        <input id="editTeamB" required class="w-full bg-surface-container-low/50 border-b-2 border-white/10 rounded-t-lg px-4 py-3 focus:outline-none focus:border-primary-fixed"/>
                    </div>
                </div>
                <div class="flex flex-col gap-2">
                    <label class="text-xs text-on-surface-variant uppercase">Date & Time</label>
                    <input type="datetime-local" id="editMatchDate" required class="w-full bg-surface-container-low/50 border-b-2 border-white/10 rounded-t-lg px-4 py-3 focus:outline-none focus:border-primary-fixed text-black"/>
                </div>
                <div class="flex flex-col gap-2">
                    <label class="text-xs text-on-surface-variant uppercase">Total Capacity</label>
                    <input type="number" id="editTotalTickets" required class="w-full bg-surface-container-low/50 border-b-2 border-white/10 rounded-t-lg px-4 py-3 focus:outline-none focus:border-primary-fixed"/>
                </div>
                <button type="submit" class="w-full mt-2 bg-primary-fixed text-on-primary-fixed font-bold py-4 rounded-lg hover:bg-primary-fixed-dim transition-all">
                    Save Changes
                </button>
            </form>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://127.0.0.1:5000';

        document.addEventListener('DOMContentLoaded', () => {
            const createForm = document.getElementById('createMatchForm');
            const matchesList = document.getElementById('matchesList');
            const matchCountEl = document.getElementById('matchCount');
            const searchInput = document.getElementById('searchInput');
            
            let allMatches = []; // Variable to hold our matches for local filtering

            const API = {
                getMatches: async () => {
                    const response = await fetch(`${API_BASE_URL}/matches`);
                    if (!response.ok) throw new Error('Failed to fetch matches');
                    const data = await response.json();
                    return data.matches.map(match => ({
                        id: match.id,
                        teamA: match.team_a,
                        teamB: match.team_b,
                        matchDate: match.match_date,
                        totalTickets: match.total_tickets
                    }));
                },
                getMatchById: async (id) => {
                    const response = await fetch(`${API_BASE_URL}/matches/${id}`);
                    if (!response.ok) throw new Error('Failed to fetch match details');
                    const data = await response.json();
                    return data["match details"] || data.match; 
                },
                createMatch: async (data) => {
                    const formattedDate = data.matchDate.replace('T', ' ') + ':00';
                    const payload = {
                        team_a: data.teamA,
                        team_b: data.teamB,
                        match_date: formattedDate,
                        total_tickets: parseInt(data.totalTickets),
                        available_tickets: parseInt(data.totalTickets)
                    };
                    const response = await fetch(`${API_BASE_URL}/matches`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error('Failed to create match');
                    return await response.json();
                },
                updateMatch: async (id, data) => {
                    const formattedDate = data.matchDate.replace('T', ' ') + ':00';
                    const payload = {
                        team_a: data.teamA,
                        team_b: data.teamB,
                        match_date: formattedDate,
                        total_tickets: parseInt(data.totalTickets)
                    };
                    const response = await fetch(`${API_BASE_URL}/matches/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error('Failed to update match');
                    return await response.json();
                },
                deleteMatch: async (id) => {
                    const response = await fetch(`${API_BASE_URL}/matches/${id}`, {
                        method: 'DELETE'
                    });
                    if (!response.ok) throw new Error('Failed to delete match');
                    return await response.json();
                }
            };

            const formatDate = (dateString) => {
                const date = new Date(dateString);
                return new Intl.DateTimeFormat('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }).format(date);
            };

            const createMatchCardHTML = (match) => {
                return `
                    <div class="bg-surface-container/50 hover:bg-surface-container transition-colors rounded-lg p-4 border border-white/5 flex flex-col md:flex-row gap-4 justify-between" id="match-${match.id}">
                        <div class="flex flex-col gap-2">
                            <div class="flex items-center gap-3">
                                <span class="font-bold text-lg">${match.teamA}</span>
                                <span class="text-sm italic opacity-70">vs</span>
                                <span class="font-bold text-lg">${match.teamB}</span>
                            </div>
                            <div class="flex gap-4 text-sm opacity-80">
                                <span>📅 ${formatDate(match.matchDate)}</span>
                                <span>🎟️ ${match.totalTickets.toLocaleString()} capacity</span>
                            </div>
                        </div>
                        <div class="flex gap-2 h-fit">
                            <button onclick="window.openEditModal('${match.id}')" class="bg-secondary-container/20 hover:bg-secondary-container text-on-secondary-container px-4 py-2 rounded flex items-center gap-2 text-sm border border-secondary-container/20 transition-all">
                                <span class="material-symbols-outlined text-[18px]">edit</span> Edit
                            </button>
                            <button onclick="window.deleteMatchHandler('${match.id}')" class="bg-error-container/20 hover:bg-error-container text-error px-4 py-2 rounded flex items-center gap-2 text-sm border border-error/20 transition-all">
                                <span class="material-symbols-outlined text-[18px]">delete</span> Delete
                            </button>
                        </div>
                    </div>
                `;
            };

            const renderMatches = (matchesToRender) => {
                matchesList.innerHTML = matchesToRender.length 
                    ? matchesToRender.map(createMatchCardHTML).join('') 
                    : '<p class="text-center mt-10 opacity-50">No matches found.</p>';
                matchCountEl.textContent = matchesToRender.length;
            };

            const loadMatches = async () => {
                try {
                    allMatches = await API.getMatches(); 
                    
                    const searchTerm = searchInput.value.toLowerCase();
                    const filtered = allMatches.filter(match => 
                        match.teamA.toLowerCase().includes(searchTerm) || 
                        match.teamB.toLowerCase().includes(searchTerm)
                    );
                    
                    renderMatches(filtered);
                } catch (error) {
                    matchesList.innerHTML = `<div class="text-error p-4">Make sure Flask API is running!</div>`;
                }
            };

            searchInput.addEventListener('input', (e) => {
                const searchTerm = e.target.value.toLowerCase();
                const filteredMatches = allMatches.filter(match => 
                    match.teamA.toLowerCase().includes(searchTerm) || 
                    match.teamB.toLowerCase().includes(searchTerm)
                );
                renderMatches(filteredMatches);
            });

            window.deleteMatchHandler = async (id) => {
                if(confirm('Are you sure you want to delete this match?')) {
                    await API.deleteMatch(id);
                    loadMatches(); 
                }
            };

            // Modal logic
            const editModal = document.getElementById('editModal');
            const editForm = document.getElementById('editMatchForm');

            window.closeEditModal = () => {
                editModal.classList.add('hidden');
            };

            window.openEditModal = async (id) => {
                try {
                    const match = await API.getMatchById(id);
                    
                    // Format datetime for the input
                    const dateObj = new Date(match.match_date);
                    const tzOffset = dateObj.getTimezoneOffset() * 60000;
                    const localISOTime = (new Date(dateObj - tzOffset)).toISOString().slice(0, 16);

                    document.getElementById('editMatchId').value = match.id;
                    document.getElementById('editTeamA').value = match.team_a;
                    document.getElementById('editTeamB').value = match.team_b;
                    document.getElementById('editMatchDate').value = localISOTime;
                    document.getElementById('editTotalTickets').value = match.total_tickets;

                    editModal.classList.remove('hidden');
                } catch (error) {
                    alert("Error fetching match details.");
                }
            };

            editForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const id = document.getElementById('editMatchId').value;
                const data = {
                    teamA: document.getElementById('editTeamA').value,
                    teamB: document.getElementById('editTeamB').value,
                    matchDate: document.getElementById('editMatchDate').value,
                    totalTickets: document.getElementById('editTotalTickets').value
                };
                
                try {
                    await API.updateMatch(id, data);
                    window.closeEditModal();
                    loadMatches(); 
                    alert("Match updated successfully!");
                } catch (error) {
                    alert("Error updating match.");
                }
            });

            createForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(createForm);
                const data = Object.fromEntries(formData.entries());
                
                try {
                    await API.createMatch(data);
                    createForm.reset();
                    searchInput.value = ''; 
                    loadMatches();
                    alert("Match created successfully!");
                } catch (error) {
                    alert("Error creating match. Is the backend running?");
                }
            });

            loadMatches();
        });
    </script>
</body>
</html>
